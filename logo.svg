<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <!-- Circular Outer Background -->
  <circle cx="256" cy="256" r="248" fill="url(#bgGrad)" stroke="url(#primaryGrad)" stroke-width="12"/>
  <circle cx="256" cy="256" r="230" fill="none" stroke="#334155" stroke-width="3" stroke-dasharray="8 6"/>

  <!-- Owl Mascot Motif -->
  <g>
    <!-- Owl Body -->
    <ellipse cx="256" cy="240" rx="140" ry="155" fill="url(#primaryGrad)"/>
    
    <!-- Owl Belly -->
    <ellipse cx="256" cy="265" rx="95" ry="110" fill="#f8fafc"/>
    
    <!-- Belly Feathers -->
    <path d="M226 230 Q256 250 286 230" stroke="#cbd5e1" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M216 265 Q256 288 296 265" stroke="#cbd5e1" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M230 300 Q256 320 282 300" stroke="#cbd5e1" stroke-width="6" fill="none" stroke-linecap="round"/>

    <!-- Left Eye Ring and Eye -->
    <circle cx="205" cy="180" r="48" fill="#ffffff" stroke="#e2e8f0" stroke-width="4"/>
    <circle cx="205" cy="180" r="30" fill="#0f172a"/>
    <circle cx="214" cy="172" r="10" fill="#ffffff"/>

    <!-- Right Eye Ring and Eye -->
    <circle cx="307" cy="180" r="48" fill="#ffffff" stroke="#e2e8f0" stroke-width="4"/>
    <circle cx="307" cy="180" r="30" fill="#0f172a"/>
    <circle cx="316" cy="172" r="10" fill="#ffffff"/>

    <!-- Beak -->
    <polygon points="256,200 240,225 272,225" fill="url(#accentGrad)"/>

    <!-- Glasses Frame -->
    <circle cx="205" cy="180" r="50" fill="none" stroke="url(#accentGrad)" stroke-width="8"/>
    <circle cx="307" cy="180" r="50" fill="none" stroke="url(#accentGrad)" stroke-width="8"/>
    <path d="M255 180 Q256 174 257 180" stroke="url(#accentGrad)" stroke-width="8" fill="none" stroke-linecap="round"/>

    <!-- Owl Ears -->
    <polygon points="140,130 180,95 200,140" fill="#047857"/>
    <polygon points="372,130 332,95 312,140" fill="#047857"/>
  </g>

  <!-- Graduation Cap -->
  <g>
    <polygon points="256,65 375,105 256,140 137,105" fill="#1e293b" stroke="url(#accentGrad)" stroke-width="5"/>
    <polygon points="215,126 256,140 297,126 297,148 256,162 215,148" fill="#0f172a"/>
    <path d="M340 100 Q365 125 362 165" stroke="url(#accentGrad)" stroke-width="6" fill="none" stroke-linecap="round"/>
    <circle cx="362" cy="172" r="8" fill="url(#accentGrad)"/>
  </g>

  <!-- Bottom Brand Text -->
  <g>
    <rect x="76" y="390" width="360" height="74" rx="22" fill="#0f172a" stroke="url(#primaryGrad)" stroke-width="4"/>
    <text x="256" y="440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="34" fill="#ffffff" text-anchor="middle" letter-spacing="2">
      <tspan fill="#10b981">BD</tspan> HỌC VỤ
    </text>
  </g>
</svg>