        ctaText: "TRẢI NGHIỆM MIỄN PHÍ NGAY &rarr;",

    let currentSlide = 0;
    let autoPlayTimer = null;
    let currentRatio = 'linkedin'; // 'linkedin' (4:5) | 'tiktok' (9:16) | 'desktop' (16:9)

    function setRatio(mode) {
      currentRatio = mode;
      const frameContainer = document.getElementById("slideFrameContainer");
      const card = document.getElementById("slideCard");

      ['btnRatioLinkedin', 'btnRatioTiktok', 'btnRatioDesktop'].forEach(id => {
        const btn = document.getElementById(id);
        btn.className = "px-3 py-1.5 rounded-lg transition text-slate-600 hover:text-slate-900 flex items-center gap-1";
      });

      if (mode === 'linkedin') {
        frameContainer.className = "w-full max-w-[490px] transition-all duration-300 flex justify-center";
        card.className = "w-full min-h-[620px] bg-white border border-slate-200/90 rounded-3xl p-5 sm:p-7 shadow-xl shadow-slate-200/60 relative flex flex-col justify-between overflow-hidden";
        document.getElementById("btnRatioLinkedin").className = "px-3 py-1.5 rounded-lg transition text-white bg-red-600 shadow-sm flex items-center gap-1";
      } else if (mode === 'tiktok') {
        frameContainer.className = "w-full max-w-[390px] transition-all duration-300 flex justify-center";
        card.className = "w-full min-h-[690px] bg-white border border-slate-200/90 rounded-3xl p-5 sm:p-6 shadow-xl shadow-slate-200/60 relative flex flex-col justify-between overflow-hidden";
        document.getElementById("btnRatioTiktok").className = "px-3 py-1.5 rounded-lg transition text-white bg-red-600 shadow-sm flex items-center gap-1";
      } else {
        frameContainer.className = "w-full max-w-4xl transition-all duration-300 flex justify-center";
        card.className = "w-full min-h-[530px] bg-white border border-slate-200/90 rounded-3xl p-6 sm:p-8 shadow-xl shadow-slate-200/60 relative flex flex-col justify-between overflow-hidden";
        document.getElementById("btnRatioDesktop").className = "px-3 py-1.5 rounded-lg transition text-white bg-red-600 shadow-sm flex items-center gap-1";
      }

      renderSlide(currentSlide);
    }

    function renderSlide(index) {
      const slide = SLIDES_DATA[index];
      const container = document.getElementById("slideContent");

      // SPECIAL OVERVIEW SLIDE (Slide 2 - Ecosystem Diagram như trong ảnh của người dùng)
      if (slide.isOverview) {
        renderOverviewSlide(slide, container);
        updateNavigation(index);
        return;
      }

      const bulletsHtml = slide.bullets.map(b => `
        <div class="flex items-start gap-2.5 bg-slate-50 hover:bg-slate-100/90 border border-slate-200/70 p-3 rounded-xl transition duration-150">
          <span class="text-xl mt-0.5">${b.icon}</span>
          <div>
            <h4 class="text-xs sm:text-sm font-bold text-slate-900 leading-snug">${b.title}</h4>
            <p class="text-[11px] sm:text-xs text-slate-600 mt-0.5 leading-relaxed">${b.desc}</p>
          </div>
        </div>
      `).join("");

      const actionHtml = slide.ctaUrl
        ? `<a href="${slide.ctaUrl}" target="_blank" class="w-full py-2.5 bg-gradient-to-r from-red-600 to-amber-600 hover:from-red-500 hover:to-amber-500 text-white font-extrabold text-xs sm:text-sm rounded-xl shadow-md transition active:scale-95 text-center inline-block">${slide.ctaText}</a>`
        : `<button onclick="${slide.ctaAction}" class="w-full py-2.5 bg-gradient-to-r from-red-600 to-amber-600 hover:from-red-500 hover:to-amber-500 text-white font-extrabold text-xs sm:text-sm rounded-xl shadow-md transition active:scale-95 text-center">${slide.ctaText}</button>`;

      if (currentRatio === 'desktop') {
        // Desktop 2 columns
        container.innerHTML = `
          <div class="grid grid-cols-12 gap-6 items-center flex-1">
            <div class="col-span-7 flex flex-col items-start text-left">
              
              <!-- SLOGAN CALLOUT -->
              <div class="mb-2 flex items-center gap-2">
                <span class="text-[10px] font-black px-2.5 py-0.5 rounded-md border ${slide.tagClass} uppercase tracking-wider">${slide.sloganBadge}</span>
                <span class="text-xs font-black text-red-600 tracking-tight">★ ${slide.sloganHighlight}</span>
              </div>

              <h2 class="text-2xl sm:text-3xl font-black text-slate-900 leading-tight mb-2 tracking-tight">
                ${slide.title}
              </h2>
              <p class="text-xs sm:text-sm text-slate-600 font-medium mb-3.5 leading-relaxed">
                ${slide.subtitle}
              </p>

              <div class="w-full space-y-2 mb-4">
                ${bulletsHtml}
              </div>

              <div class="w-full max-w-xs">
                ${actionHtml}
              </div>
            </div>

            <div class="col-span-5 flex flex-col items-center justify-center text-center">
              <div class="w-52 h-52 sm:w-60 sm:h-60 rounded-2xl overflow-hidden border-2 border-amber-400 bg-amber-50/50 p-1 shadow-xl relative">
                <img src="${slide.mascot}" alt="Cú BeeDee" class="w-full h-full object-cover rounded-xl">
                <div class="absolute bottom-2 right-2 bg-white/90 backdrop-blur-sm text-[10px] font-extrabold text-slate-900 px-2 py-0.5 rounded-lg border border-slate-200">
                  🦉 Cú BeeDee
                </div>
              </div>
              <div class="mt-3 bg-amber-50/90 border border-amber-200/90 px-3.5 py-2 rounded-xl text-center max-w-xs">
                <p class="text-[11px] font-bold text-amber-900 italic leading-snug">
                  ${slide.mascotMood}
                </p>
              </div>
            </div>
          </div>
        `;
      } else {
        // Mobile / Vertical (LinkedIn 4:5 & TikTok 9:16)
        container.innerHTML = `
          <div class="flex flex-col items-center text-center flex-1">
            
            <!-- SLOGAN HEADER BANNER -->
            <div class="mb-1.5 flex flex-col items-center">
              <span class="text-[10px] font-black px-2.5 py-0.5 rounded-md border ${slide.tagClass} uppercase tracking-wider mb-1">
                ${slide.sloganBadge}
              </span>
              <span class="text-[11px] sm:text-xs font-black text-red-600 tracking-tight flex items-center gap-1">
                <span>✨</span> <span>${slide.sloganHighlight}</span>
              </span>
            </div>

            <h2 class="text-lg sm:text-xl font-black text-slate-900 leading-tight mb-1 tracking-tight">
              ${slide.title}
            </h2>
            <p class="text-[11px] sm:text-xs text-slate-600 font-medium mb-2.5 px-1 leading-relaxed">
              ${slide.subtitle}
            </p>

            <!-- MASCOT HERO -->
            <div class="relative w-32 h-32 sm:w-40 sm:h-40 rounded-2xl overflow-hidden border-2 border-amber-400 bg-amber-50 p-1 shadow-lg mb-2">
              <img src="${slide.mascot}" alt="Cú BeeDee" class="w-full h-full object-cover rounded-xl">
              <div class="absolute bottom-1.5 right-1.5 bg-white/90 backdrop-blur-sm text-[9px] font-extrabold text-slate-900 px-1.5 py-0.5 rounded border border-slate-200">
                🦉 Cú BeeDee
              </div>
            </div>

            <!-- MOOD SPEECH -->
            <div class="bg-amber-50/90 border border-amber-200/80 px-3 py-1 rounded-xl mb-2.5 max-w-xs">
              <p class="text-[10px] sm:text-[11px] font-bold text-amber-900 italic">
                ${slide.mascotMood}
              </p>
            </div>

            <!-- BULLETS -->
            <div class="w-full space-y-1.5 text-left mb-3">
              ${bulletsHtml}
            </div>

            <!-- CTA -->
            <div class="w-full">
              ${actionHtml}
            </div>

          </div>
        `;
      }

      updateNavigation(index);
    }

    // SPECIAL RENDER FOR OVERVIEW ECOSYSTEM (Tái hiện sơ đồ vũ trụ trong ảnh)
    function renderOverviewSlide(slide, container) {
      const gridItems = slide.features.map(f => `
        <button onclick="goToSlide(${f.slideIdx})" class="group flex flex-col items-center justify-center p-2.5 bg-slate-50 hover:bg-red-50/60 border border-slate-200 hover:border-red-300 rounded-2xl transition duration-200 hover:scale-105 active:scale-95 shadow-2xs">
          <div class="w-10 h-10 rounded-xl bg-white shadow-sm border border-slate-200 flex items-center justify-center text-xl group-hover:border-red-400 transition">
            ${f.icon}
          </div>
          <span class="text-[10px] sm:text-xs font-extrabold text-slate-800 group-hover:text-red-700 mt-1.5 text-center leading-tight">
            ${f.name}
          </span>
        </button>
      `).join("");

      container.innerHTML = `
        <div class="flex flex-col items-center text-center flex-1 justify-between">
          
          <div>
            <div class="mb-1.5 flex flex-col items-center">
              <span class="text-[10px] font-black px-2.5 py-0.5 rounded-md border ${slide.tagClass} uppercase tracking-wider mb-1">
                ${slide.sloganBadge}
              </span>
              <span class="text-xs sm:text-sm font-black text-red-600 tracking-tight flex items-center gap-1">
                <span>✨</span> <span>${slide.sloganHighlight}</span>
              </span>
            </div>

            <h2 class="text-lg sm:text-2xl font-black text-slate-900 leading-tight mb-1 tracking-tight">
              ${slide.title}
            </h2>
            <p class="text-[11px] sm:text-xs text-slate-600 font-medium mb-3 max-w-md mx-auto">
              ${slide.subtitle}
            </p>
          </div>

          <!-- VISUAL SOLAR SYSTEM CENTER -->
          <div class="relative w-full max-w-sm my-1 py-3 flex items-center justify-center">
            
            <!-- Orbit Ring -->
            <div class="absolute w-64 h-64 sm:w-72 sm:h-72 rounded-full border border-dashed border-slate-300/80 pointer-events-none"></div>

            <!-- Center Core -->
            <div class="w-24 h-24 sm:w-28 sm:h-28 rounded-full bg-gradient-to-br from-red-600 via-red-600 to-amber-600 text-white flex flex-col items-center justify-center p-2 text-center shadow-xl pulse-glow-red z-10 border-2 border-white">
              <span class="text-lg">🦉</span>
              <span class="text-[9px] sm:text-[10px] font-black uppercase tracking-tight leading-tight mt-0.5">BD BÌNH DÂN<br>HỌC VỤ</span>
            </div>
          </div>

          <!-- 9 VỆ TINH GRID (Interactive Quick Links) -->
          <div class="w-full">
            <p class="text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-2">Bấm vào từng vệ tinh để xem chi tiết:</p>
            <div class="grid grid-cols-3 gap-2 w-full max-w-md mx-auto mb-3">
              ${gridItems}
            </div>

            <button onclick="nextSlide()" class="w-full py-2.5 bg-gradient-to-r from-red-600 to-amber-600 hover:from-red-500 hover:to-amber-500 text-white font-extrabold text-xs sm:text-sm rounded-xl shadow-md transition active:scale-95 text-center">
              ${slide.ctaText}
            </button>
          </div>

        </div>
      `;
    }

    function updateNavigation(index) {
      document.getElementById("slideCounter").innerText = `${index + 1} / ${SLIDES_DATA.length}`;
      const dotsContainer = document.getElementById("dotIndicators");
      dotsContainer.innerHTML = SLIDES_DATA.map((_, i) => `
        <button onclick="goToSlide(${i})" class="h-2 rounded-full transition-all duration-200 ${i === index ? 'w-5 bg-red-600' : 'w-2 bg-slate-300 hover:bg-slate-400'}" title="Slide ${i+1}"></button>
      `).join("");
    }

    function nextSlide() {
      currentSlide = (currentSlide + 1) % SLIDES_DATA.length;
      renderSlide(currentSlide);
    }

    function prevSlide() {
      currentSlide = (currentSlide - 1 + SLIDES_DATA.length) % SLIDES_DATA.length;
      renderSlide(currentSlide);
    }

    function goToSlide(index) {
      currentSlide = index;
      renderSlide(currentSlide);
    }

    function toggleAutoPlay() {
      const btn = document.getElementById("btnAutoPlay");
      if (autoPlayTimer) {
        clearInterval(autoPlayTimer);
        autoPlayTimer = null;
        btn.innerText = "▶ Tự động";
        btn.classList.remove("bg-red-600", "text-white");
      } else {
        autoPlayTimer = setInterval(nextSlide, 5000);
        btn.innerText = "⏸ Tạm dừng";
        btn.classList.add("bg-red-600", "text-white");
      }
    }

    window.addEventListener("keydown", (e) => {
      if (e.key === "ArrowRight" || e.key === " ") nextSlide();
      else if (e.key === "ArrowLeft") prevSlide();
    });

    // Default start with LinkedIn Mode (4:5)
    setRatio('linkedin');
  </script>
</body>
